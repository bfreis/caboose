# Installed to /etc/tmux.conf in the image. tmux here is a session-persistence
# mechanism wrapped around a full-screen TUI, not an interactive multiplexer,
# so the defaults are tuned for "invisible" rather than "featureful".

# No status bar: Claude Code draws its own full-screen UI and a green bar
# across the bottom is the single most obvious tell that you are inside tmux.
set -g status off

# Truecolor. tmux advertises $TERM's capabilities to programs inside it, and
# the launcher forwards the host's real TERM/COLORTERM, so declare RGB support
# explicitly -- otherwise Claude Code's palette degrades to 256 or 8 colors.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# Synchronized output (DEC mode 2026): the terminal commits a repaint as one
# frame instead of painting it progressively, which is what removes tearing
# from a TUI that redraws constantly. Declared here rather than left to the
# terminfo entry, because the container may not have one for your terminal --
# the launcher imports it when it can, and this covers the case where it
# cannot. Terminals without the capability ignore the sequence.
set -as terminal-features ",*:sync"

# OSC 8 hyperlinks -- what makes a rendered link clickable rather than just
# underlined. tmux does not forward them blindly: it parses OSC 8 into
# per-cell state and re-emits it to the client only if that client's terminfo
# carries `Hls`, a tmux-invented extended capability that essentially no
# terminal ships -- not Ghostty, kitty, WezTerm, foot or iTerm2. The default
# is therefore to swallow every hyperlink, and a TUI that renders link text
# over a URL (Claude Code does, via OSC 8) leaves nothing to click. Declaring
# the feature supplies the capability tmux is looking for; terminals that do
# not understand OSC 8 ignore the sequence, same as the two above.
#
# `allow-passthrough` below does NOT cover this, despite the name: it only
# unwraps the explicit DCS `\ePtmux;` envelope, which OSC 8 never uses.
set -as terminal-features ",*:hyperlinks"

# Window title. Claude Code names what it is doing with OSC 0/2, and tmux
# takes that as the pane's title (#T) -- but keeps it: unless `set-titles`
# is on it never sets the outer terminal's title, which is left showing
# whatever launched it. Pass the pane title through verbatim. The `title`
# feature supplies the terminfo entries tmux sets it with (tsl/fsl), for
# the same reason as `sync` above: the host terminal's own entry may be
# missing in here.
set -g set-titles on
set -g set-titles-string "#T"
set -as terminal-features ",*:title"

# Let OSC sequences reach the real terminal: clipboard writes (OSC 52),
# notifications, inline images.
set -g allow-passthrough on
set -g set-clipboard on

# ESC is a prefix in a TUI's key handling; the default 500ms wait makes the
# whole interface feel laggy.
set -sg escape-time 0

# Let the TUI know when it gains/loses focus, and resize to the attached
# client rather than the smallest historical one.
set -g focus-events on
setw -g aggressive-resize on

# Mouse OFF, deliberately. With `mouse on` tmux swallows scroll and click
# events to drive its own copy-mode, so the TUI never sees them and scrolling
# lands you in a tmux pager instead of Claude Code's own scroll. Off means the
# events pass through to the application.
set -g mouse off

set -g history-limit 50000

# --- transparency: tmux must not own any keystroke ---------------------------
#
# C-b is tmux's default prefix, so it intercepts the one keystroke a readline
# user presses most (backward-char) and Claude Code never receives it. There is
# no prefix worth relocating to here: this tmux exists only to keep a session
# alive, and every command it offers is reachable from the host as
# `tmux <cmd>` via docker exec. So it gets no command key at all.
set -g prefix None
set -g prefix2 None
# Only `prefix` is a real key table -- `prefix2` is an option naming a second
# key that activates that same table, so there is no prefix2 table to unbind
# and asking for one is a config error.
unbind -a -T prefix

# Detach by closing the terminal (the client's tty disappears and the session
# survives), or from another terminal with `caboose detach`.

# Pass modified keys (CSI u / extended keys) through rather than folding them
# into their unmodified form -- this is what makes Shift+Enter, Ctrl+Enter and
# friends reach the TUI instead of arriving as a bare Enter.
set -s extended-keys on
set -as terminal-features ",*:extkeys"

